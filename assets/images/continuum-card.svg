<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none"><title>A long-running case moves through its steps, survives a crash, and resumes without repeating the fix.</title><defs><radialGradient id="cbg" cx=".55" cy=".45" r=".8"><stop stop-color="#1d4154"/><stop offset="1" stop-color="#0c1c33"/></radialGradient><pattern id="cdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a3b8dc" opacity=".14"/></pattern><filter id="cshadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020c1b" flood-opacity=".5"/></filter><linearGradient id="ctrack" x1="0" x2="1"><stop stop-color="#64ffda" stop-opacity=".25"/><stop offset=".5" stop-color="#64ffda"/><stop offset="1" stop-color="#64ffda" stop-opacity=".9"/></linearGradient></defs><rect width="600" height="360" fill="url(#cbg)"/><rect width="600" height="360" fill="url(#cdots)"/><g filter="url(#cshadow)"><rect x="150" y="44" width="300" height="92" rx="16" fill="#233653" stroke="#64ffda" stroke-opacity=".7"/></g><rect x="170" y="64" width="30" height="30" rx="8" fill="#64ffda"/><path d="M178 79l5 5 9-10" stroke="#0c1c33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><text x="214" y="76" fill="#e6f1ff" font-size="15" font-weight="700">Case resumed</text><text x="214" y="96" fill="#9fb0cf" font-size="13">picked up at the same step</text></g><rect x="170" y="108" width="132" height="16" rx="8" fill="#64ffda" fill-opacity=".14" stroke="#64ffda" stroke-opacity=".6"/><text x="236" y="120" fill="#64ffda" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">POSTED ONCE</text><path d="M60 240H540" stroke="#2c4160" stroke-width="3" stroke-linecap="round"/><path d="M60 240H300" stroke="url(#ctrack)" stroke-width="3" stroke-linecap="round"/><path d="M372 240H540" stroke="#64ffda" stroke-width="3" stroke-linecap="round"/><path d="M300 240c14-14 22 14 36 0s22 14 36 0" stroke="#f8b87a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7"/><path d="M300 240C306 176 366 176 372 240" stroke="#64ffda" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M366 230l6 10 7-9" stroke="#64ffda" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#0c1c33" stroke-width="3"><circle cx="80" cy="240" r="9" stroke="#64ffda" fill="#64ffda"/><circle cx="160" cy="240" r="9" stroke="#64ffda" fill="#64ffda"/><circle cx="240" cy="240" r="9" stroke="#64ffda" fill="#64ffda"/><circle cx="420" cy="240" r="9" stroke="#64ffda" fill="#64ffda"/><circle cx="500" cy="240" r="11" stroke="#64ffda"/></g><circle cx="500" cy="240" r="20" stroke="#64ffda" stroke-opacity=".35" stroke-width="2"/><g transform="translate(336 214)"><circle r="13" fill="#2a1f22" stroke="#f8b87a" stroke-width="2"/><path d="M-5-5l10 10M5-5l-10 10" stroke="#f8b87a" stroke-width="2.5" stroke-linecap="round"/></g><g font-family="Arial,sans-serif" font-size="13" fill="#9fb0cf" text-anchor="middle"><text x="80" y="276">Match</text><text x="160" y="276">Investigate</text><text x="240" y="276">Verify</text><text x="336" y="298" fill="#f8b87a">crash</text><text x="420" y="276">Approve</text><text x="500" y="276" fill="#64ffda">Post</text></g><text x="336" y="178" fill="#64ffda" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">resume</text></svg>
